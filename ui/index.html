<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Job Pipeline</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b8cff'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Crect x='7' y='8' width='5' height='16' rx='1.6' fill='white'/%3E%3Crect x='13.5' y='8' width='5' height='11' rx='1.6' fill='white' opacity='.85'/%3E%3Crect x='20' y='8' width='5' height='7' rx='1.6' fill='white' opacity='.7'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eff1f5; --surface-3:#e6e9ef; --border:#e1e4ea; --text:#141b26; --muted:#657084;
  --accent:#2f5fe8; --accent-2:#7a4cf0; --accent-ink:#ffffff; --accent-soft:rgba(47,95,232,.1);
  --ok:#12805c; --warn:#b54708; --bad:#c0262d; --bad-soft:rgba(192,38,45,.1);
  --applied:#2f5fe8; --interview:#7a4cf0; --offer:#12805c; --rejected:#7d8798; --ghosted:#b54708;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05); --shadow-lg:0 12px 32px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.08);
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#161b23; --surface-2:#1d2430; --surface-3:#262e3c; --border:#2a3341; --text:#e9edf3; --muted:#9aa5b6;
  --accent:#6f97ff; --accent-2:#a58bff; --accent-ink:#0a1020; --accent-soft:rgba(111,151,255,.14);
  --ok:#4cc79b; --warn:#f0a35e; --bad:#ff7b80; --bad-soft:rgba(255,123,128,.14);
  --applied:#6f97ff; --interview:#a58bff; --offer:#4cc79b; --rejected:#808a9b; --ghosted:#f0a35e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.25); --shadow-lg:0 16px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#161b23; --surface-2:#1d2430; --surface-3:#262e3c; --border:#2a3341; --text:#e9edf3; --muted:#9aa5b6;
  --accent:#6f97ff; --accent-2:#a58bff; --accent-ink:#0a1020; --accent-soft:rgba(111,151,255,.14);
  --ok:#4cc79b; --warn:#f0a35e; --bad:#ff7b80; --bad-soft:rgba(255,123,128,.14);
  --applied:#6f97ff; --interview:#a58bff; --offer:#4cc79b; --rejected:#808a9b; --ghosted:#f0a35e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.25); --shadow-lg:0 16px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
*{scrollbar-width:thin;scrollbar-color:var(--surface-3) transparent}
[hidden]{display:none!important}

/* layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand svg{border-radius:9px;box-shadow:0 2px 8px rgba(91,140,255,.35)}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;width:100%;align-items:center;gap:11px;background:none;border:0;border-radius:10px;padding:9px 10px;text-align:left;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{margin-left:auto;min-width:20px;text-align:center;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;background:var(--surface-3);color:var(--muted)}
.badge.due{background:var(--bad);color:#fff}
.rail-foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:10px 8px 2px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
.rail-foot .mode{flex:1;display:flex;align-items:center;gap:7px}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(18,128,92,.18)}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:none;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.danger:hover{background:var(--bad-soft);color:var(--bad)}
main{padding:28px 34px 60px;max-width:1560px;width:100%;min-width:0}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head .grow{flex:1;min-width:220px}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 2px}
.sub{color:var(--muted);margin:0}
h3{margin:0}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;background:var(--accent);color:var(--accent-ink);border:1px solid transparent;border-radius:10px;padding:8px 14px;font-weight:600;transition:filter .15s,transform .05s,background .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--surface);color:var(--text);border-color:var(--border);font-weight:500}
.btn.sec:hover{background:var(--surface-2);filter:none}
.btn.ghost{background:none;color:var(--muted);border-color:transparent;font-weight:500}
.btn.ghost:hover{background:var(--surface-2);color:var(--text);filter:none}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.link-btn{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 8px;border-radius:8px}
.link-btn:hover{background:var(--accent-soft)}
label.lbl,.lbl{display:block;font-weight:600;font-size:12.5px;margin:0 0 6px;color:var(--text)}
.field{margin-bottom:16px}
.field .err{color:var(--bad);font-size:12px;margin-top:4px;display:none}
.field.invalid .err{display:block}
.field.invalid .input,.field.invalid .ctl{border-color:var(--bad)}
.input,textarea.input,.ctl{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px;transition:border-color .15s,box-shadow .15s}
.input:hover,.ctl:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.input:focus,.ctl:focus-visible,.ctl[aria-expanded="true"]{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder{color:var(--muted);opacity:.75}
textarea.input{min-height:220px;font-family:ui-monospace,Consolas,monospace;font-size:13px;resize:vertical;line-height:1.55}
.ctl-wrap{position:relative}
.ctl{display:flex;align-items:center;gap:9px;text-align:left;min-height:40px}
.ctl .ctl-val{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl .ctl-val.ph{color:var(--muted);opacity:.8}
.ctl > .ic:last-child{color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.search{position:relative;min-width:240px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .input{padding-left:36px;padding-right:34px}
.kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px ui-monospace,Consolas,monospace;border:1px solid var(--border);border-radius:6px;padding:0 6px;color:var(--muted);background:var(--surface-2)}
.hint{color:var(--muted);font-size:12px}

/* popover (custom dropdown + calendar) */
#pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;max-height:min(380px,65vh);overflow:auto;animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.opt{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;user-select:none}
.opt .ic{margin-left:auto;color:var(--accent)}
.opt.active,.opt:hover{background:var(--surface-2)}
.opt[aria-selected="true"]{font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.cal{width:284px;padding:6px}
#pop:has(.cal){max-height:none;overflow:visible}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-title{font-weight:700}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-week span{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.day{height:34px;border-radius:9px;border:0;background:none;color:var(--text);font-weight:500;position:relative}
.day:hover{background:var(--surface-2)}
.day.out{color:var(--muted);opacity:.5}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink);font-weight:700;opacity:1}
.day.focus{outline:2px solid var(--accent);outline-offset:-2px}
.cal-foot{display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}

/* cards, stats, board */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.stat .si{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.stat b{display:block;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span.l{color:var(--muted);font-size:12px}
.stat.warn .si{background:var(--bad-soft);color:var(--bad)}
.board{display:grid;grid-template-columns:repeat(5,minmax(214px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--surface-2);border-radius:14px;padding:10px;min-height:150px;transition:background .15s,box-shadow .15s}
.col.over{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.col h3{margin:2px 6px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;gap:8px}
.col h3 .cnt{margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:0 8px;font-size:11px}
.col h3 i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);width:100%;text-align:left;display:block;transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card.dragging{opacity:.45}
.card-top{display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12.5px;color:#fff;background:hsl(var(--h) 52% 46%);flex:none}
.card b{display:block;line-height:1.25}
.card small{color:var(--muted);display:block;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;border-radius:99px;padding:2px 8px;border:1px solid var(--border);color:var(--muted);background:var(--surface)}
.pill.due{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-soft);font-weight:600}
.pill.soon{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.pill.status{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent);font-weight:600}
.prog{display:flex;gap:3px;margin-top:10px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--surface-3)}
.prog i.on{background:var(--ok)}
.note{color:var(--muted);font-size:12px;margin-top:8px}
.empty{color:var(--muted);font-size:13px;padding:14px 8px;text-align:center}
.empty-state{background:var(--surface);border:1px dashed var(--border);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty-state .eic{width:52px;height:52px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px}
.empty-state h3{color:var(--text);margin-bottom:4px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.grid-2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px;align-items:start;max-width:1100px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:10px 0 10px 40px;position:relative;border-bottom:1px solid var(--border)}
.steps li:last-child{border:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px}
.promptbox{background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:10px 12px;font:12px/1.55 ui-monospace,Consolas,monospace;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.out{background:var(--surface-2);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;margin-top:10px;max-height:240px;overflow:auto}
.todo{background:color-mix(in srgb,var(--warn) 28%,transparent);border-radius:4px;padding:0 3px}
.banner{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--warn) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 55%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent);font-weight:600}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.list-row:last-child{border:0}
.list-row .grow{flex:1;min-width:0}
.skeleton{height:90px;border-radius:12px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.5);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(1080px,100%);background:var(--bg);z-index:21;transform:translateX(102%);visibility:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s linear .24s;display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible;transition-delay:0s;box-shadow:-10px 0 40px rgba(0,0,0,.25)}
.d-head{padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;gap:14px;align-items:center}
.d-head h2{margin:0;font-size:18px;letter-spacing:-.01em}
.d-body{display:grid;grid-template-columns:300px minmax(0,1fr);flex:1;min-height:0}
.d-side{border-right:1px solid var(--border);overflow:auto;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:18px}
.d-main{overflow:auto;padding:18px 22px}
.sec-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:0 0 8px}
.check{display:flex;align-items:center;gap:9px;padding:4px 0;color:var(--muted)}
.check.ok{color:var(--text)}
.check .ci{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--border);flex:none}
.check.ok .ci{background:var(--ok);border-color:var(--ok);color:#fff}
.next{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:12px;padding:12px}
.next b{display:block;margin-bottom:2px}
.next p{margin:0 0 10px;color:var(--muted);font-size:12.5px}
.files{list-style:none;margin:0;padding:0}
.files button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:8px;color:var(--text);font-size:13px;word-break:break-all}
.files button:hover{background:var(--surface-2)}
.files button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.files .grp{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:12px 8px 2px;display:flex;align-items:center;gap:6px}
.viewer{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 24px;min-height:320px;box-shadow:var(--shadow)}
.viewer pre{white-space:pre-wrap;font:13px/1.6 ui-monospace,Consolas,monospace;margin:0}
.viewer iframe{width:100%;height:72vh;border:0;border-radius:10px;background:#fff}
.vbar{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.vbar b{margin-right:auto;display:flex;align-items:center;gap:8px}
.md h1{font-size:20px;margin:0 0 10px;letter-spacing:-.01em}.md h2{font-size:16px;margin:22px 0 6px}.md h3{font-size:14px;margin:16px 0 4px}
.md p{margin:8px 0}.md ul,.md ol{margin:6px 0 6px 20px;padding:0}.md li{margin:2px 0}.md code{background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:12.5px}
.md table{border-collapse:collapse;margin:10px 0;width:100%;font-size:13px}.md th,.md td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}.md th{background:var(--surface-2)}
.md hr{border:0;border-top:1px solid var(--border);margin:16px 0}
.md blockquote{margin:8px 0;padding:2px 12px;border-left:3px solid var(--border);color:var(--muted)}
.md pre{background:var(--surface-2);padding:10px;border-radius:10px;overflow:auto}

/* action cards + quick-open rows */
.act{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.act-h{display:flex;align-items:center;gap:8px}
.act p{margin:4px 0 8px;color:var(--muted);font-size:12.5px;line-height:1.45}
.act-warn{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--warn);margin:0 0 8px;line-height:1.4}
.act-warn .ic{margin-top:1px}
button.check{width:calc(100% + 12px);background:none;border:0;text-align:left;border-radius:8px;padding:5px 6px;margin:0 -6px;cursor:pointer;font:inherit}
button.check:hover{background:var(--surface-2)}
button.check .go{margin-left:auto;color:var(--muted)}
/* full-page reader */
.drawer.wide{width:100%}
.drawer.wide .d-body{grid-template-columns:minmax(0,1fr)}
.drawer.wide .d-side{display:none}
.drawer.wide .d-main{padding:24px clamp(16px,4vw,56px)}
.drawer.wide .viewer{max-width:1180px;margin:0 auto;padding:26px 32px}
.drawer.wide .md{font-size:15px;line-height:1.7}
.drawer.wide .viewer iframe{height:82vh}
.reader{display:grid;grid-template-columns:230px minmax(0,1fr);gap:34px;align-items:start}
.outline{position:sticky;top:0;max-height:calc(100vh - 150px);overflow:auto;font-size:13px;padding-right:6px}
.outline a{display:block;padding:4px 10px;border-left:2px solid var(--border);color:var(--muted);text-decoration:none;line-height:1.35}
.outline a:hover{color:var(--text);border-color:var(--accent)}
.outline a.l3{padding-left:22px;font-size:12.5px}
.md [id]{scroll-margin-top:12px}
@media (max-width:900px){#vWide{display:none}.reader{grid-template-columns:1fr}.outline{display:none}}
/* modal + toast */
.modal-back{position:fixed;inset:0;background:rgba(8,12,18,.55);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:90;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);padding:22px;width:min(440px,100%);animation:pop .16s ease-out}
.modal-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:12px}
.modal-ic.danger{background:var(--bad-soft);color:var(--bad)}
.modal h3{font-size:17px;margin-bottom:6px}
.modal p{margin:0 0 18px;color:var(--muted)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:100;pointer-events:none;width:max-content;max-width:92vw}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow-lg);animation:pop .16s ease-out;max-width:100%}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}
.toast.err{background:var(--bad);color:#fff}

/* responsive */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px;border-right:0;border-top:1px solid var(--border);z-index:15;justify-content:space-around}
  .brand,.rail-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;text-align:center;justify-content:center;width:auto;flex:1}
  .nav .badge{position:absolute;margin:0;transform:translate(14px,-12px)}
  .nav button{position:relative}
  main{padding:18px 16px 90px}
  .row,.grid-2{grid-template-columns:1fr}
  .d-body{grid-template-columns:1fr;overflow:auto}
  .d-side{border-right:0;border-bottom:1px solid var(--border);overflow:visible}
  .d-main{overflow:visible}
  .board{grid-template-columns:repeat(5,80vw)}
  #toasts{bottom:84px}
  .search{min-width:0;width:100%}
  .stats{grid-template-columns:1fr 1fr}
  .stat{padding:10px 12px;gap:10px}
  .stat b{font-size:19px}
  .stat:last-child{grid-column:1/-1}
  .d-head{padding:12px 14px}
  .d-side,.d-main{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- icons ---------- */
const ICONS = {
  board: '<rect x="3" y="3" width="5" height="18" rx="1.5"/><rect x="10" y="3" width="5" height="12" rx="1.5"/><rect x="17" y="3" width="4" height="8" rx="1.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
  sliders: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',

  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',

  edit: '<path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14-4L4 9M4 5v4h4M4 13a8 8 0 0 0 14 4l2-2M20 19v-4h-4"/>',
  link: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 1.8L21.5 18.5l-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/>',
  alert: '<path d="M12 4l9 16H3zM12 10v4M12 17.2v.01"/>',
  undo: '<path d="M4 9h11a5 5 0 0 1 0 10H8M4 9l4-4M4 9l4 4"/>',
  inbox: '<path d="M4 13l2-8h12l2 8v6H4zM4 13h5l1 2h4l1-2h5"/>',
  briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
  bell: '<path d="M12 4a6 6 0 0 0-6 6c0 5-2 6-2 6h16s-2-1-2-6a6 6 0 0 0-6-6M10 20a2 2 0 0 0 4 0"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  clip: '<path d="M16 8l-7 7a2 2 0 0 1-3-3l8-8a4 4 0 0 1 6 6l-8.5 8.5a6 6 0 0 1-8.5-8.5"/>',
  expand: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  shrink: '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>',
};
const ic = (n, s = 18) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ""}</svg>`;

/* ---------- state ---------- */
let S = null, view = "pipeline", openIdx = null, curFile = null, editing = false, q = "", profDirty = false, wide = false;
const LABEL = { applied: "Applied", interview: "Interview", offer: "Offer", rejected: "Rejected", ghosted: "No reply" };
const NAV = [["pipeline", "board", "Pipeline"], ["add", "plus", "Add job"], ["profile", "user", "Profile"], ["trash", "trash", "Trash"], ["tools", "sliders", "Tools & help"]];
const isDue = r => r.follow_up && r.follow_up <= S.today && ["applied", "interview"].includes(r.status);
const isSoon = r => r.follow_up && !isDue(r) && ["applied", "interview"].includes(r.status) && (new Date(r.follow_up) - new Date(S.today)) / 864e5 <= 2;
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const initials = s => String(s).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
const fmtDate = v => v ? new Date(v + "T00:00:00").toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" }) : "";

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Requested-With": "jobsys" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch { j = null; }
  if (!r.ok) throw new Error((j && j.error) || t || r.statusText);
  return j ?? t;
}
function toast(msg, o = {}) {
  const t = document.createElement("div"); t.className = "toast " + (o.kind || "");
  const s = document.createElement("span"); s.textContent = msg; t.append(s);
  if (o.action) { const b = document.createElement("button"); b.textContent = o.action; b.onclick = () => { t.remove(); o.onAction && o.onAction(); }; t.append(b); }
  $("#toasts").append(t); setTimeout(() => t.remove(), o.ms || (o.action ? 7000 : 3200));
}
const fail = e => toast(e.message || String(e), { kind: "err", ms: 6000 });
async function copy(text, msg = "Copied. Paste it into your AI assistant.") { try { await navigator.clipboard.writeText(text); toast(msg); return true; } catch { toast("Copy failed. Select the text and copy it manually.", { kind: "err" }); return false; } }
function guard() { if (S && S.demo) { toast("Demo mode is read-only."); return false; } return true; }

/* ---------- popover: custom dropdown + calendar ---------- */
const popEl = $("#pop"); let pop = null;
function openPop(anchor, html, opts = {}) {
  closePop(false); popEl.innerHTML = html; popEl.hidden = false; pop = { anchor, ...opts };
  anchor.setAttribute("aria-expanded", "true"); placePop();
}
function placePop() {
  if (!pop) return; const r = pop.anchor.getBoundingClientRect();
  popEl.style.minWidth = r.width + "px"; popEl.style.left = "0px"; popEl.style.top = "0px";
  const w = popEl.offsetWidth, h = popEl.offsetHeight;
  const left = Math.min(Math.max(8, r.left), innerWidth - w - 8); let top = r.bottom + 6;
  if (top + h > innerHeight - 8 && r.top - h - 6 > 8) top = r.top - h - 6;
  popEl.style.left = left + "px"; popEl.style.top = top + "px";
}
function closePop(focus = true) {
  if (!pop) return; const a = pop.anchor; a.setAttribute("aria-expanded", "false");
  popEl.hidden = true; popEl.innerHTML = ""; popEl.onclick = null; pop = null; if (focus) a.focus();
}
document.addEventListener("mousedown", e => { if (pop && !popEl.contains(e.target) && !pop.anchor.contains(e.target)) closePop(false); });
addEventListener("resize", () => closePop(false));
addEventListener("scroll", e => { if (pop && !popEl.contains(e.target)) closePop(false); }, true);

function Select({ options, value, onChange, label }) {
  const wrap = document.createElement("div"); wrap.className = "ctl-wrap";
  const btn = document.createElement("button"); btn.type = "button"; btn.className = "ctl";
  btn.setAttribute("aria-haspopup", "listbox"); btn.setAttribute("aria-expanded", "false"); if (label) btn.setAttribute("aria-label", label);
  wrap.append(btn);
  const me = { el: wrap, value };
  const labelOf = v => (options.find(o => o.value === v) || {}).label ?? "";
  const paint = () => { const o = options.find(x => x.value === me.value); btn.innerHTML = `${o && o.dot ? `<span class="dot" style="background:${o.dot}"></span>` : ""}<span class="ctl-val">${esc(labelOf(me.value))}</span>${ic("down", 16)}`; };
  function open() {
    let active = Math.max(0, options.findIndex(o => o.value === me.value));
    const html = () => `<div role="listbox">${options.map((o, i) => `<div role="option" class="opt ${i === active ? "active" : ""}" data-i="${i}" aria-selected="${o.value === me.value}">${o.dot ? `<span class="dot" style="background:${o.dot}"></span>` : ""}<span>${esc(o.label)}</span>${o.value === me.value ? ic("check", 16) : ""}</div>`).join("")}</div>`;
    openPop(btn, html(), {
      onKey(e) {
        if (e.key === "Enter") { choose(active); e.preventDefault(); return true; }
        if (e.key === "ArrowDown") active = (active + 1) % options.length;
        else if (e.key === "ArrowUp") active = (active - 1 + options.length) % options.length;
        else if (e.key === "Home") active = 0; else if (e.key === "End") active = options.length - 1; else return false;
        popEl.innerHTML = html(); const a = $(".opt.active", popEl); a && a.scrollIntoView({ block: "nearest" }); e.preventDefault(); return true;
      }
    });
    popEl.onclick = ev => { const o = ev.target.closest(".opt"); if (o) choose(+o.dataset.i); };
  }
  function choose(i) { const v = options[i].value; closePop(); if (v !== me.value) { me.value = v; paint(); onChange && onChange(v); } }
  btn.addEventListener("click", () => (pop && pop.anchor === btn) ? closePop() : open());
  btn.addEventListener("keydown", e => { if (!pop && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); open(); } });
  paint(); return me;
}

const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
function DatePick({ value = "", onChange, placeholder = "Select date", label }) {
  const wrap = document.createElement("div"); wrap.className = "ctl-wrap";
  const btn = document.createElement("button"); btn.type = "button"; btn.className = "ctl";
  btn.setAttribute("aria-haspopup", "dialog"); btn.setAttribute("aria-expanded", "false"); if (label) btn.setAttribute("aria-label", label);
  wrap.append(btn);
  const me = { el: wrap, value };
  const paint = () => { btn.innerHTML = `${ic("calendar", 16)}<span class="ctl-val ${me.value ? "" : "ph"}">${esc(me.value ? fmtDate(me.value) : placeholder)}</span>`; };
  function cal(f, sel) {
    const first = new Date(f.getFullYear(), f.getMonth(), 1), start = new Date(first); start.setDate(1 - first.getDay());
    const today = iso(new Date()), fi = iso(f); let cells = "";
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i); const s = iso(d);
      const cls = ["day", d.getMonth() !== f.getMonth() ? "out" : "", s === today ? "today" : "", s === sel ? "sel" : "", s === fi ? "focus" : ""].join(" ");
      cells += `<button type="button" class="${cls}" data-d="${s}" tabindex="-1" aria-label="${esc(d.toDateString())}"${s === sel ? ' aria-pressed="true"' : ""}>${d.getDate()}</button>`;
    }
    return `<div class="cal" role="dialog" aria-label="Choose a date"><div class="cal-head"><button type="button" class="icon-btn" data-nav="-1" aria-label="Previous month">${ic("left")}</button><div class="cal-title">${esc(f.toLocaleDateString(undefined, { month: "long", year: "numeric" }))}</div><button type="button" class="icon-btn" data-nav="1" aria-label="Next month">${ic("right")}</button></div><div class="cal-week">${["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"].map(x => `<span>${x}</span>`).join("")}</div><div class="cal-grid">${cells}</div><div class="cal-foot"><button type="button" class="link-btn" data-act="clear">Clear</button><button type="button" class="link-btn" data-act="today">Today</button></div></div>`;
  }
  function open() {
    let f = me.value ? parseISO(me.value) : new Date();
    const redraw = () => { popEl.innerHTML = cal(f, me.value); };
    const pick = v => { closePop(); me.value = v; paint(); onChange && onChange(v); };
    openPop(btn, cal(f, me.value), {
      onKey(e) {
        const mv = n => { f = new Date(f.getFullYear(), f.getMonth(), f.getDate() + n); };
        if (e.key === "ArrowLeft") mv(-1); else if (e.key === "ArrowRight") mv(1); else if (e.key === "ArrowUp") mv(-7); else if (e.key === "ArrowDown") mv(7);
        else if (e.key === "PageUp") f = new Date(f.getFullYear(), f.getMonth() - 1, Math.min(f.getDate(), 28));
        else if (e.key === "PageDown") f = new Date(f.getFullYear(), f.getMonth() + 1, Math.min(f.getDate(), 28));
        else if (e.key === "Enter") { pick(iso(f)); e.preventDefault(); return true; }
        else return false;
        redraw(); e.preventDefault(); return true;
      }
    });
    popEl.onclick = ev => {
      const day = ev.target.closest("[data-d]"), nav = ev.target.closest("[data-nav]"), act = ev.target.closest("[data-act]");
      if (day) pick(day.dataset.d);
      else if (nav) { f = new Date(f.getFullYear(), f.getMonth() + +nav.dataset.nav, 1); redraw(); }
      else if (act) { act.dataset.act === "today" ? pick(iso(new Date())) : pick(""); }
    };
  }
  btn.addEventListener("click", () => (pop && pop.anchor === btn) ? closePop() : open());
  btn.addEventListener("keydown", e => { if (!pop && e.key === "ArrowDown") { e.preventDefault(); open(); } });
  paint(); return me;
}

/* ---------- confirm dialog ---------- */
let modal = null;
function confirmDialog({ title, body, confirm = "Confirm", danger = false, icon = "alert" }) {
  return new Promise(res => {
    const root = $("#modal-root"), prev = document.activeElement;
    root.innerHTML = `<div class="modal-back"><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mt" aria-describedby="mb"><div class="modal-ic ${danger ? "danger" : ""}">${ic(icon, 22)}</div><h3 id="mt">${esc(title)}</h3><p id="mb">${esc(body)}</p><div class="modal-actions"><button class="btn sec" data-r="0">Cancel</button><button class="btn ${danger ? "danger" : ""}" data-r="1">${esc(confirm)}</button></div></div></div>`;
    const done = v => { root.innerHTML = ""; modal = null; prev && prev.focus && prev.focus(); res(v); };
    modal = { close: done };
    root.onclick = e => { const b = e.target.closest("[data-r]"); if (b) done(b.dataset.r === "1"); else if (e.target.classList.contains("modal-back")) done(false); };
    $(".btn.sec", root).focus();
  });
}

/* ---------- load + shell ---------- */
async function load() {
  S = await api("/api/state");
  $("#modeLabel").textContent = S.demo ? "Demo (sample data)" : "Local, private";
  renderNav(); render(); if (openIdx !== null) renderDrawer();
}
function renderNav() {
  const due = S.rows.filter(isDue).length, tr = S.trash.length;
  $("#nav").innerHTML = NAV.map(([v, i, l]) => `<button data-view="${v}" aria-current="${v === view ? "page" : "false"}">${ic(i, 19)}<span>${l}</span>${v === "pipeline" && due ? `<span class="badge due" title="Follow-ups due">${due}</span>` : ""}${v === "trash" && tr ? `<span class="badge">${tr}</span>` : ""}</button>`).join("");
  $$("#nav button").forEach(b => b.onclick = () => setView(b.dataset.view));
  $("#themeBtn").innerHTML = ic(document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches) ? "sun" : "moon", 18);
}
async function leaveOk() {
  const vt = $("#vText"), edDirty = editing && vt && vt.dataset.orig !== vt.value;
  if (!(profDirty || edDirty)) return true;
  const ok = await confirmDialog({ title: "Discard unsaved changes?", body: "You have edits that are not saved. If you leave now they will be lost.", confirm: "Discard changes", danger: true });
  if (ok) { profDirty = false; editing = false; }
  return ok;
}
async function requestClose() { if (await leaveOk()) closeDrawer(); }
async function setView(v) { if (!(await leaveOk())) return; closeDrawer(); view = v; renderNav(); render(); scrollTo(0, 0); }
function render() {
  const banner = S.demo ? `<div class="banner">${ic("alert", 18)}<div><b>Demo mode.</b> Fictional sample data, read-only. The real version runs privately on the owner's PC.</div></div>` : "";
  $("#main").innerHTML = banner + ({ pipeline: vPipeline, add: vAdd, profile: vProfile, trash: vTrash, tools: vTools }[view])();
  ({ pipeline: bindPipeline, add: bindAdd, profile: bindProfile, trash: bindTrash, tools: bindTools }[view])();
}

/* ---------- pipeline ---------- */
function ready(r) {
  const f = (r.folder && S.files[r.folder]) || [], has = (p, min = 0) => f.some(x => x.name === p && x.size > min);
  return [{ k: "Analysis", ok: has("02_analysis.md", 250), step: "apply", path: "02_analysis.md" }, { k: "CV (PDF)", ok: has("03_cv/Abir_Hasan_CV.pdf"), step: "apply", path: "03_cv/Abir_Hasan_CV.pdf" },
          { k: "Email", ok: has("04_email/application_email.txt"), step: "apply", path: "04_email/application_email.txt" }, { k: "Interview prep", ok: has("05_prep/prep.md"), step: "prep", path: "05_prep/prep.md", wide: true }];

    <div><h4 class="sec-title">Progress</h4>${rd.map(x => x.ok ? `<button class="check ok" data-open="${esc(x.path)}" data-wide="${x.wide ? 1 : 0}" title="Open ${esc(x.k)}"><span class="ci">${ic("check", 12)}</span>${esc(x.k)}<span class="go">${ic("right", 14)}</span></button>` : `<div class="check"><span class="ci"></span>${esc(x.k)}</div>`).join("")}</div>

  const stSel = Select({ options: stOpts, value: r.status, label: "Stage", onChange: v => upd({ status: v }) }); $("#mStatus").append(stSel.el);

function editDetails(r) {

async function showFile(path) {
  curFile = path; editing = false;
  $$("#fileList [data-f]").forEach(b => b.setAttribute("aria-current", b.dataset.f === path));
  const v = $("#viewer"), ext = path.split(".").pop().toLowerCase(), name = path.split("/").pop();
  const wideBtn = `<button class="btn sec sm" id="vWide" title="${wide ? "Exit full page (Esc)" : "Read in full page"}">${ic(wide ? "shrink" : "expand", 14)} ${wide ? "Exit full page" : "Full page"}</button>`;
  const bar = extra => `<div class="vbar"><b>${ic(ext === "pdf" ? "pdf" : "file", 16)} ${esc(name)}</b>${extra}${wideBtn}</div>`;
  if (ext === "pdf") {
    v.classList.remove("md"); v.innerHTML = bar(`<button class="btn sec sm" id="vOpen">${ic("link", 14)} Open</button>`) + `<iframe title="${esc(name)}" src="/api/file?path=${encodeURIComponent(path)}"></iframe>`;
    $("#vOpen").onclick = () => guard() && api("/api/open", { path }).catch(fail); return;
  }
  if (ext === "docx") { v.classList.remove("md"); v.innerHTML = bar(`<button class="btn sec sm" id="vOpen">${ic("link", 14)} Open in Word</button>`); $("#vOpen").onclick = () => guard() && api("/api/open", { path }).catch(fail); return; }
  const text = await fetch("/api/file?path=" + encodeURIComponent(path)).then(r => r.text()), canEdit = ["md", "txt", "json"].includes(ext);
  const draw = () => {
    if (editing) {
      v.classList.remove("md"); v.innerHTML = bar(`<button class="btn sm" id="vSave">Save</button><button class="btn sec sm" id="vCancel">Cancel</button>`) + `<textarea class="input" id="vText" style="min-height:60vh" spellcheck="false"></textarea>`;
      $("#vText").value = text; $("#vText").dataset.orig = text; $("#vCancel").onclick = () => { editing = false; draw(); };
      const save = async () => { try { await api("/api/save", { path, content: $("#vText").value }); toast("Saved"); showFile(path); } catch (e) { fail(e); } };
      $("#vSave").onclick = save; $("#vText").onkeydown = e => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); } };
    } else {
      v.classList.toggle("md", ext === "md");
      v.innerHTML = bar(`<button class="btn sec sm" id="vCopy">${ic("copy", 14)} Copy</button>` + (canEdit ? `<button class="btn sec sm" id="vEdit">${ic("edit", 14)} Edit</button>` : "")) + (ext === "md" ? reader(text) : `<pre>${esc(text)}</pre>`);

      if (canEdit) $("#vEdit").onclick = () => { if (!guard()) return; editing = true; draw(); };
    }
  };
  draw();
}

/* ---------- tiny markdown renderer (input is escaped first) ---------- */
function md(src) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[FILL IN[^\]]*\]|\bTODO\b/g, m => `<span class="todo">${m}</span>`);
  const L = src.replace(/\r/g, "").split("\n"); let o = "", i = 0; const heads = []; md.heads = heads;
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { let b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; o += `<pre>${esc(b.join("\n"))}</pre>`; continue; }
    if (/^\|.*\|\s*$/.test(l) && /^\|[\s:|-]+\|\s*$/.test(L[i + 1] || "")) {
      const cells = r => r.trim().slice(1, -1).split("|").map(c => c.trim()); const head = cells(l); i += 2; const rows = [];
      while (i < L.length && /^\|.*\|\s*$/.test(L[i])) rows.push(cells(L[i++]));
      o += `<table><thead><tr>${head.map(h => `<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`; continue;
    }
    let m;
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) { const id = "h" + heads.length; heads.push({ lvl: m[1].length, text: m[2].replace(/[*`]/g, ""), id }); o += `<h${m[1].length} id="${id}">${inline(m[2])}</h${m[1].length}>`; i++; continue; }
    if (/^---+\s*$/.test(l)) { o += "<hr>"; i++; continue; }
    if (/^>\s?/.test(l)) { o += `<blockquote>${inline(l.replace(/^>\s?/, ""))}</blockquote>`; i++; continue; }
    if (/^\s*[-*]\s+/.test(l)) { const it = []; while (i < L.length && /^\s*[-*]\s+/.test(L[i])) it.push(L[i++].replace(/^\s*[-*]\s+/, "")); o += `<ul>${it.map(x => { const c = x.match(/^\[([ x])\]\s*(.*)/); return `<li>${c ? (c[1] === "x" ? "&#9745; " : "&#9744; ") + inline(c[2]) : inline(x)}</li>`; }).join("")}</ul>`; continue; }
    if (/^\s*\d+\.\s+/.test(l)) { const it = []; while (i < L.length && /^\s*\d+\.\s+/.test(L[i])) it.push(L[i++].replace(/^\s*\d+\.\s+/, "")); o += `<ol>${it.map(x => `<li>${inline(x)}</li>`).join("")}</ol>`; continue; }
    if (!l.trim()) { i++; continue; }
    const p = [l]; i++; while (i < L.length && L[i].trim() && !/^(#|>|\||```|\s*[-*]\s|\s*\d+\.\s|---)/.test(L[i])) p.push(L[i++]);
    o += `<p>${inline(p.join(" "))}</p>`;
  }
  return o;
}

/* ---------- global keys, theme, boot ---------- */
document.addEventListener("keydown", e => {
  if (modal) { if (e.key === "Escape") { modal.close(false); e.preventDefault(); } else if (e.key === "Tab") { const b = $$("#modal-root button"), i = b.indexOf(document.activeElement); e.preventDefault(); b[(i + (e.shiftKey ? -1 : 1) + b.length) % b.length].focus(); } return; }
  if (pop) { if (e.key === "Escape") { closePop(); e.preventDefault(); return; } if (pop.onKey && pop.onKey(e)) return; }
  if (e.key === "Escape" && openIdx !== null) { if (wide) { toggleWide(); return; } requestClose(); return; }
  const t = e.target, typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
  if (typing || e.ctrlKey || e.metaKey || e.altKey || !S) return;
  if (e.key === "/" ) { e.preventDefault(); if (view !== "pipeline") setView("pipeline"); const q = $("#q"); q && q.focus(); }
  else if (e.key.toLowerCase() === "n") { e.preventDefault(); setView("add"); }
});
